<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — officework</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #0f172a;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-container {
      width: 100%;
      max-width: 420px;
    }
    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .brand-icon {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: #fff;
      font-weight: 800;
      font-size: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      margin-bottom: 12px;
      box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4);
    }
    .brand-header h1 {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
    }
    .brand-header p {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .login-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 12px;
      font-size: 16px;
      color: #94a3b8;
      pointer-events: none;
    }
    .form-control {
      width: 100%;
      padding: 11px 12px 11px 40px;
      font-size: 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: all 0.2s;
      background: #f8fafc;
      color: var(--text-main);
    }
    .form-control:focus {
      background: #fff;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    .btn-toggle-pw {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 16px;
      padding: 0;
    }
    .form-footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      font-size: 13px;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #475569;
      cursor: pointer;
      user-select: none;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    .btn-submit:hover {
      background: var(--primary-hover);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
      transform: translateY(-1px);
    }
    .error-alert {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="brand-header">
      <div class="brand-icon">OW</div>
      <h1>officework</h1>
      <p>Monthly Attendance & Salary Reporting Suite</p>
    </div>

    <div class="login-card">
      {% if error %}
      <div class="error-alert">
        <span>⚠️</span>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form action="/login" method="POST">
        <input type="hidden" name="next" value="{{ next_url }}">

        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" required autofocus autocomplete="username" value="{{ username or '' }}">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="btn-toggle-pw" onclick="togglePassword()" title="Show/Hide password">👁️</button>
          </div>
        </div>

        <div class="form-footer-row">
          <label class="checkbox-label">
            <input type="checkbox" name="remember" value="true" checked>
            <span>Keep me signed in</span>
          </label>
        </div>

        <button type="submit" class="btn-submit">Sign In to Dashboard →</button>
      </form>
    </div>

    <div class="login-footer">
      Protected with secure session authentication • {{ current_year or 2026 }}
    </div>
  </div>

  <script>
    function togglePassword() {
      const pwInput = document.getElementById('password');
      if (pwInput.type === 'password') {
        pwInput.type = 'text';
      } else {
        pwInput.type = 'password';
      }
    }
  </script>
</body>
</html>
